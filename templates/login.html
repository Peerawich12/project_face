<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เข้าสู่ระบบสำหรับครูผู้สอน — School Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 max-w-md w-full p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600 text-white flex items-center justify-center text-2xl mx-auto shadow">
                🔐
            </div>
            <h1 class="text-xl font-bold text-slate-800">เข้าสู่ระบบสำหรับครูผู้สอน</h1>
            <p class="text-xs text-slate-500">
                เพื่อเข้าดูรายชื่อนักเรียนรายบุคคลตามมาตรฐาน PDPA
            </p>
        </div>

        {% if error %}
        <div class="bg-rose-50 border border-rose-200 text-rose-700 text-sm px-4 py-3 rounded-xl">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">ชื่อผู้ใช้ (Username)</label>
                <input type="text" name="username" value="teacher" required
                    class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" name="password" placeholder="••••••••" required
                    class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                <p class="text-xs text-slate-400 mt-1">ค่าเริ่มต้นสำหรับทดสอบ: <code>teacher</code> / <code>school1234</code></p>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl shadow transition">
                เข้าสู่ระบบ
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-100">
            <a href="/" class="text-xs text-slate-500 hover:text-indigo-600">
                ← กลับไปยังหน้าแดชบอร์ดสาธารณะ
            </a>
        </div>
    </div>
</body>
</html>
