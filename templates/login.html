<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เข้าสู่ระบบสำหรับครูผู้สอน — Project Face</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: IBM Plex Sans Thai & Sarabun -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'IBM Plex Sans Thai', 'Sarabun', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 antialiased">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 max-w-md w-full p-6 sm:p-8 space-y-6">
        <!-- Header -->
        <div class="text-center space-y-1.5">
            <div class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center shadow-sm mx-auto mb-3">
                <!-- Lucide: Lock -->
                <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1 class="text-lg sm:text-xl font-bold tracking-tight text-slate-900">เข้าสู่ระบบสำหรับครูผู้สอน</h1>
            <p class="text-xs text-slate-500">
                เพื่อเข้าดูรายชื่อนักเรียนรายบุคคลตามมาตรฐาน PDPA
            </p>
        </div>

        <!-- Jinja2 Error Alert -->
        {% if error %}
        <div role="alert" class="flex items-start gap-2.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs sm:text-sm px-3.5 py-3 rounded-xl">
            <!-- Lucide: AlertCircle -->
            <svg class="w-4 h-4 text-rose-600 mt-0.5 flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span class="leading-relaxed">{{ error }}</span>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="POST" action="/login" class="space-y-4">
            <!-- Username Field -->
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-700 mb-1.5">
                    ชื่อผู้ใช้ (Username)
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required
                    placeholder="กรอกชื่อผู้ใช้"
                    class="w-full bg-white border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10 transition"
                />
            </div>

            <!-- Password Field with Toggle -->
            <div>
                <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">
                    รหัสผ่าน (Password)
                </label>
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                        placeholder="กรอกรหัสผ่าน"
                        class="w-full bg-white border border-slate-300 rounded-xl pl-3.5 pr-11 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-slate-900 focus:ring-2 focus:ring-slate-900/10 transition"
                    />
                    <button
                        type="button"
                        id="toggle-password"
                        aria-label="แสดงรหัสผ่าน"
                        aria-controls="password"
                        class="absolute inset-y-0 right-0 w-11 flex items-center justify-center text-slate-400 hover:text-slate-600 focus:outline-none focus-visible:ring-2 focus-visible:ring-slate-900/20 focus-visible:text-slate-800 rounded-r-xl transition"
                    >
                        <!-- Lucide: Eye -->
                        <svg id="eye-icon" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <!-- Lucide: EyeOff -->
                        <svg id="eye-off-icon" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full bg-slate-900 hover:bg-slate-800 active:bg-slate-950 text-white font-medium text-sm py-2.5 rounded-xl shadow-sm transition duration-150 focus:outline-none focus:ring-2 focus:ring-slate-900/20"
            >
                เข้าสู่ระบบ
            </button>
        </form>

        <!-- Back to Dashboard Link -->
        <div class="text-center pt-2 border-t border-slate-100">
            <a href="/" class="inline-flex items-center gap-1.5 text-xs text-slate-500 hover:text-slate-800 transition">
                <!-- Lucide: ArrowLeft -->
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                กลับไปยังหน้าแดชบอร์ดสาธารณะ
            </a>
        </div>
    </div>

    <!-- Password Visibility Toggle Script -->
    <script>
        const toggleBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');
        const eyeOffIcon = document.getElementById('eye-off-icon');

        if (toggleBtn && passwordInput && eyeIcon && eyeOffIcon) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                toggleBtn.setAttribute('aria-label', isPassword ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
                eyeIcon.classList.toggle('hidden', isPassword);
                eyeOffIcon.classList.toggle('hidden', !isPassword);
            });
        }
    </script>
</body>
</html>
